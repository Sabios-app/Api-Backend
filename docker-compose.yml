services:
  postgres:
    image: postgres:16-alpine
    container_name: sabios-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sabios_db
      POSTGRES_USER: sabios_user
      POSTGRES_PASSWORD: sabios_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
